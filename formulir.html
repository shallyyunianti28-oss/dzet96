<section id="daftar">
            <h2>Form Pendaftaran</h2>
            <form>

                <label for="nama">Nama Lengkap:</label><br>
                <input type="text" id="nama" name="nama">
                <br><br>

                <label for="email">Email:</label><br>
                <input type="email" id="email" name="email">
                <br><br>

                <label for="kelas">Kelas:</label><br>

                <select id="kelas" name="kelas">
                    <option>X RPL 1</option>
                    <option>X RPL 2</option>
                    <option>XI RPL 1</option>
                    <option>XI RPL 2</option>
                </select>

                <br><br>

                <label>Jenis Kelamin:</label><br>

                <input type="radio" id="laki" name="jenis_kelamin" value="Laki-laki">
                <label for="laki">Laki-laki</label>

                <br>

                <input type="radio" id="perempuan" name="jenis_kelamin" value="Perempuan">
                <label for="perempuan">Perempuan</label>

                <br><br>

                <label>Minat yang ingin dipelajari:</label><br>

                <input type="checkbox" id="web" name="minat" value="Web Development">
                <label for="web">Web Development</label>

                <br>

                <input type="checkbox" id="game" name="minat" value="Game Development">
                <label for="game">Game Development</label>

                <br>

                <input type="checkbox" id="uiux" name="minat" value="UI/UX">
                <label for="uiux">UI/UX</label>

                <br>

                <input type="checkbox" id="mobile" name="minat" value="Mobile Development">
                <label for="mobile">Mobile Development</label>

                <br><br>

                <label for="alasan">Alasan ingin bergabung:</label><br>

                <textarea id="alasan" name="alasan" rows="5" cols="40"></textarea>

                <br><br>

                <button type="submit">Daftar</button>
                <button type="reset">Reset</button>

            </form>
        </section>

        <section>
                <footer>
        <p>Coding Club SMKN 1 Subang</p>
        <p>Rekayasa Perangkat Lunak</p>
        <p>© 2026 Coding Club SMKN 1 Subang</p>
        </footer>


        </section>

    </main>

    
</body>
</html>
